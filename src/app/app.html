@if (isOffline()) {
  <div class="offline" role="status">📡 Você está offline — exibindo dados salvos</div>
}

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">⛅</span>
      <h1>Clima</h1>
    </div>
    @if (installEvent()) {
      <button type="button" class="install" (click)="install()">Instalar app</button>
    }
  </header>

  <main>
    <app-weather />
  </main>

  <footer>
    Dados: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
    · PWA em Angular
  </footer>
</div>
